name: CI

# ─────────────────────────────────────────────────────────────────────────────
# MANUAL ONLY — this workflow does NOT run by itself.
#
# Deliberately restricted to workflow_dispatch: no push trigger, no
# pull_request trigger, no schedule. Automatic execution has not been approved,
# and a workflow that starts running the moment it merges is exactly the kind of
# thing that should be an explicit decision rather than a side effect of adding
# a file.
#
# Run it from the Actions tab, or:  gh workflow run ci.yml
#
# To enable automatic runs LATER, add the triggers back deliberately:
#   push:
#     branches: [main]
#   pull_request:
#
# It also uses NO third-party actions beyond the two official ones
# (actions/checkout, actions/setup-go). In particular it does not run gitleaks
# or any other scanner that needs a licence to run in GitHub Actions.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test the declared minimum and the current stable. The declared minimum
        # is a promise to consumers; if it stops building, either fix it or bump
        # the go directive deliberately.
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  stdlib-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # This module is embedded in other people's binaries. A dependency added
      # here becomes a dependency everywhere, so the property is enforced, not
      # merely documented.
      - name: assert no dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "::error::go.mod gained a dependency; this module must stay stdlib-only"
            exit 1
          fi
          echo "OK: stdlib-only"
